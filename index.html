<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Varun — Cooking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      overflow: hidden;
    }

    .meme-wrap {
      max-width: 960px;
      width: 90vw;
      border-radius: 18px;
      overflow: hidden;
      box-shadow:
        0 0 80px rgba(139, 92, 246, 0.12),
        0 30px 80px rgba(0, 0, 0, 0.6);
      animation: fadeUp 1s ease forwards;
    }

    .meme-wrap img {
      width: 100%;
      height: auto;
      display: block;
    }

    .status {
      margin-top: 2.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      opacity: 0;
      animation: fadeUp 1s ease 0.4s forwards;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.15);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .status span {
      font-size: 1.15rem;
      font-weight: 700;
      color: #e4e4e7;
      letter-spacing: 0.5px;
    }

    .status span em {
      font-style: normal;
      color: #a1a1aa;
      font-weight: 500;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="meme-wrap">
    <img src="meme.jpg" alt="The meme" />
  </div>

  <div class="status">
    <div class="spinner"></div>
    <span>Something's Cooking... <em>— Please stand by</em></span>
  </div>

</body>

</html>
